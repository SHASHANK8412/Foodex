# Foodex: the full stack in containers.
#
#   cp .env.example .env              set the two secrets (see the file)
#   docker compose up -d --build      web app, API and MongoDB
#                                     -> http://localhost:3000, API docs at /api/docs
#
# Optional profiles:
#   --profile data           Kafka (KRaft), Kafka UI, Spark cluster and the streaming job.
#                            Also set KAFKA_ENABLED=true in .env so the API uses the broker.
#   --profile batch          run the Spark batch job once: docker compose --profile batch up spark-batch
#   --profile observability  Prometheus scraping the API's /metrics
#
#   Web app       http://localhost:3000
#   API           http://localhost:5000  (docs: /api/docs, health: /api/health/ready)
#   Kafka UI      http://localhost:8080 (or KAFKA_UI_PORT)
#   Spark master  http://localhost:8081
#   Spark worker  http://localhost:8082
#   Prometheus    http://localhost:9090
#
# The data profile needs roughly 6 GB of memory for Docker. On a smaller
# machine set SPARK_MASTER_URL=local[2] to run the jobs without the cluster.

name: foodex

x-spark: &spark
  build: ./backend/analytics
  image: foodex-spark:3.5.4
  # Root so the jobs can write to the bind-mounted project folder on any host OS.
  user: "0:0"
  volumes:
    - ./backend/analytics:/opt/foodex/analytics
    - spark-checkpoints:/opt/foodex/checkpoints
    - spark-ivy:/tmp/.ivy2
  networks:
    - foodex

services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - foodex

  api:
    build: ./backend
    image: foodex-api:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/foodex
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      GRAPHQL_PERSISTED_SECRET: ${GRAPHQL_PERSISTED_SECRET:?Set GRAPHQL_PERSISTED_SECRET in .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: kafka:19092
      ANALYTICS_OUTPUT_DIR: /app/analytics/output
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Gold datasets written by the Spark batch job, served by the API.
      - ./backend/analytics/output:/app/analytics/output:ro
    networks:
      - foodex

  web:
    build: ./frontend
    image: foodex-web:latest
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - foodex

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - foodex

  kafka:
    profiles: ["data"]
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is used inside the Docker network (Spark, Kafka UI);
      # PLAINTEXT_HOST is what the API on the host connects to.
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - foodex

  # Creates the topics up front so Spark can subscribe before the API has started.
  kafka-init:
    profiles: ["data"]
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in foodex.order.created foodex.order.paid foodex.order.status \
                     foodex.delivery.assigned foodex.notification.requested \
                     foodex.clickstream foodex.analytics.realtime foodex.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    networks:
      - foodex

  kafka-ui:
    profiles: ["data"]
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Override with KAFKA_UI_PORT in .env if 8080 is taken on your machine.
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: foodex
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    networks:
      - foodex

  spark-master:
    profiles: ["data", "batch"]
    <<: *spark
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8081:8080"
      - "7077:7077"

  spark-worker:
    profiles: ["data", "batch"]
    <<: *spark
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 4 --memory 3g --webui-port 8081
    ports:
      - "8082:8081"

  # Spark Structured Streaming: Kafka -> windowed metrics -> Kafka, and Kafka -> bronze Parquet.
  spark-streaming:
    profiles: ["data"]
    <<: *spark
    hostname: spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    restart: on-failure
    command: >
      /opt/spark/bin/spark-submit
      --master ${SPARK_MASTER_URL:-spark://spark-master:7077}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.driver.host=spark-streaming
      --conf spark.cores.max=2
      --conf spark.executor.memory=1g
      /opt/foodex/analytics/streaming_pipeline.py
      --brokers kafka:19092
      --lake /opt/foodex/analytics/lake
      --checkpoints /opt/foodex/checkpoints

  # Spark batch (MLlib): orders -> silver -> gold datasets served by the API.
  spark-batch:
    <<: *spark
    profiles: ["batch"]
    hostname: spark-batch
    depends_on:
      - spark-worker
    command: >
      /opt/spark/bin/spark-submit
      --master ${SPARK_MASTER_URL:-spark://spark-master:7077}
      --conf spark.driver.host=spark-batch
      --conf spark.cores.max=2
      --conf spark.executor.memory=1g
      /opt/foodex/analytics/batch_features.py
      --input /opt/foodex/analytics/data/orders /opt/foodex/analytics/data/synthetic
      --output /opt/foodex/analytics/output
      --lake /opt/foodex/analytics/lake
      --dataset-label ${DATASET_LABEL:-synthetic}

networks:
  foodex:

volumes:
  mongo-data:
  spark-checkpoints:
  spark-ivy:
